name: release
# Builds prebuilt binaries when a version tag is pushed and attaches them to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest      # Apple silicon
            name: darwin-arm64
          - os: macos-13          # Intel
            name: darwin-amd64
          - os: ubuntu-latest
            name: linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install FUSE headers
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install --cask macos-fuse-t/homebrew-cask/fuse-t
          else sudo apt-get update && sudo apt-get install -y libfuse-dev fuse; fi
      - name: Test
        run: make test
      - name: Build
        run: make unlockfs VERSION=${GITHUB_REF_NAME#v}
      - name: Package
        run: |
          d=unlockfs-${GITHUB_REF_NAME#v}-${{ matrix.name }}
          mkdir "$d" && cp unlockfs LICENSE README.md "$d/" && cp -R contrib packaging "$d/"
          tar -czf "$d.tar.gz" "$d" && (shasum -a 256 "$d.tar.gz" > "$d.tar.gz.sha256")
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" unlockfs-*.tar.gz unlockfs-*.tar.gz.sha256 --clobber
